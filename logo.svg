<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <linearGradient id="scGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Group for Building Icon -->
  <g transform="translate(10, 15)" filter="url(#shadow)">
    <!-- Base Ground Line -->
    <path d="M 5 105 L 175 105" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Left Main Tower with Steeple -->
    <rect x="25" y="45" width="28" height="58" fill="#1E3A8A" rx="1"/>
    <polygon points="39,15 23,45 55,45" fill="#1E3A8A"/>
    <path d="M 39,7 L 39,16 M 35,10 L 43,10" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="34" y="52" width="10" height="16" fill="#FFFFFF" rx="5"/>
    
    <!-- Central Building Wing -->
    <polygon points="53,45 160,20 160,103 53,103" fill="#3B82F6" opacity="0.9"/>
    <polyline points="23,45 53,45 160,20" fill="none" stroke="#60A5FA" stroke-width="3"/>
    
    <!-- Windows Grid -->
    <rect x="65" y="44" width="8" height="12" fill="#FFFFFF" rx="1"/>
    <rect x="80" y="41" width="8" height="12" fill="#FFFFFF" rx="1"/>
    <rect x="95" y="38" width="8" height="12" fill="#FFFFFF" rx="1"/>
    <rect x="110" y="35" width="8" height="12" fill="#FFFFFF" rx="1"/>
    <rect x="125" y="32" width="8" height="12" fill="#FFFFFF" rx="1"/>
    <rect x="140" y="29" width="8" height="12" fill="#FFFFFF" rx="1"/>

    <rect x="65" y="62" width="8" height="12" fill="#FFFFFF" rx="1"/>
    <rect x="80" y="60" width="8" height="12" fill="#FFFFFF" rx="1"/>
    <rect x="95" y="58" width="8" height="12" fill="#FFFFFF" rx="1"/>
    <rect x="110" y="56" width="8" height="12" fill="#FFFFFF" rx="1"/>
    <rect x="125" y="54" width="8" height="12" fill="#FFFFFF" rx="1"/>
    <rect x="140" y="52" width="8" height="12" fill="#FFFFFF" rx="1"/>

    <rect x="65" y="80" width="8" height="14" fill="#FFFFFF" rx="1"/>
    <rect x="80" y="80" width="8" height="14" fill="#FFFFFF" rx="1"/>
    <rect x="110" y="78" width="10" height="16" fill="#FFFFFF" rx="1"/>
    <rect x="125" y="78" width="10" height="16" fill="#FFFFFF" rx="1"/>
    <rect x="140" y="78" width="10" height="16" fill="#FFFFFF" rx="1"/>
  </g>

  <!-- Typography -->
  <g transform="translate(195, 38)">
    <text x="0" y="28" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="30" fill="#1E3A8A" letter-spacing="-0.5">
      Santa Casa de
    </text>
    <text x="0" y="62" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="30" fill="#2563EB" letter-spacing="-0.5">
      Caridade de Bagé
    </text>
    <text x="2" y="82" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="1.5" text-transform="uppercase">
      Hospital Philanthropico • Desde 1883
    </text>
  </g>
</svg>
