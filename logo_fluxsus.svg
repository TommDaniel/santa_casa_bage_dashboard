<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="100%" height="100%">
  <defs>
    <linearGradient id="fluxCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="fluxArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="fluxGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284C7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Circular Symbol on Left -->
  <g transform="translate(8, 5)" filter="url(#fluxGlow)">
    <!-- Outer Gradient Circle Ring -->
    <circle cx="40" cy="40" r="35" fill="none" stroke="url(#fluxCircleGrad)" stroke-width="4.5"/>
    
    <!-- Medical Cross inside Left -->
    <path d="M 28 32 H 36 V 24 H 44 V 32 H 52 V 40 H 44 V 48 H 36 V 40 H 28 Z" fill="none" stroke="#0284C7" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Curving Upward Growth Arrow (S-Curve rising) -->
    <path d="M 18 52 C 24 68, 52 64, 58 42 C 62 30, 68 22, 74 16" fill="none" stroke="url(#fluxArrowGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Arrow Head -->
    <polygon points="78,13 65,17 73,26" fill="#0284C7"/>
    
    <!-- Human Icon Circle Node -->
    <circle cx="34" cy="54" r="3.5" fill="#1E3A8A"/>
  </g>

  <!-- Typography on Right -->
  <g transform="translate(95, 20)">
    <!-- Main Title: FluxSUS -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="#0284C7" letter-spacing="-0.5">
      Flux<tspan fill="#475569" font-weight="700">SUS</tspan>
    </text>
    
    <!-- Subtitle: PROCESSOS EM SAÚDE -->
    <text x="0" y="47" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#1E3A8A" letter-spacing="1.2">
      PROCESSOS EM SAÚDE
    </text>
    
    <!-- Dividing Line -->
    <line x1="0" y1="53" x2="205" y2="53" stroke="#94A3B8" stroke-width="1"/>
    
    <!-- Subtitle 2: HEALTHTECH INNOVATION -->
    <text x="25" y="63" font-family="'Inter', sans-serif" font-weight="600" font-size="7.5" fill="#64748B" letter-spacing="2">
      HEALTHTECH INNOVATION
    </text>
  </g>
</svg>
